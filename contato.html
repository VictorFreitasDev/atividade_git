<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/estilo.css">
    <title>Contato</title>
</head>

<body class="fundodemais">

    <header>

        <nav>
            <ul>

                <a class="bttninicio" href="index.html">
                    Início
                </a>

                <div class="traco"></div>

                <a class="bttninicio" href="series.html">
                    Séries
                </a>

                <div class="traco"></div>

                <a class="bttninicio" href="sobre.html">
                    Sobre
                </a>

                <div class="traco"></div>

                <a class="bttninicio" href="contato.html">
                    Contato
                </a>

            </ul>
        </nav>

    </header>

    <main class="pagina">

        <section class="conteudo contato">

            <h1>Contato</h1>

            <h2>Entre em contato</h2>

            <p>
                Se você tiver uma sugestão de série, quiser dar um feedback
                ou só mandar uma mensagem, pode falar comigo.
            </p>

            <form>

                <label for="name">Nome:</label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Digite seu nome"
                    required
                >

                <label for="email">Email:</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Digite seu email"
                    required
                >

                <label for="message">Mensagem:</label>

                <textarea
                    id="message"
                    name="message"
                    rows="6"
                    placeholder="Escreva sua mensagem"
                    required
                ></textarea>

                <input type="submit" value="Enviar">

            </form>

        </section>

    </main>

</body>

</html>
